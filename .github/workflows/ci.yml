name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @restaurant-ops/web typecheck
      - run: pnpm --filter @restaurant-ops/web test
      - run: pnpm --filter @restaurant-ops/web build
      - run: pnpm --filter @restaurant-ops/cdk typecheck
      - run: pnpm --filter @restaurant-ops/cdk test
      - run: pnpm --filter @restaurant-ops/cdk build
      - run: pnpm --filter @restaurant-ops/cdk synth

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle test --no-daemon
      - run: docker build -t restaurant-ops-api:test .

  scheduler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/scheduler/requirements.txt }
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - run: docker build -t restaurant-ops-scheduler:test .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2

