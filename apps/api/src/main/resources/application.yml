spring:
  application:
    name: restaurant-ops-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant_ops}
    username: ${DB_USERNAME:restaurant_ops}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Tokyo
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-northeast-1.amazonaws.com/demo}
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  swagger-ui:
    path: /docs
app:
  demo-tenant-id: 11111111-1111-1111-1111-111111111111
  demo-store-id: 22222222-2222-2222-2222-222222222222
  scheduling-request-queue-url: ${SCHEDULING_REQUEST_QUEUE_URL:}

